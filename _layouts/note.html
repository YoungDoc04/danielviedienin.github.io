---
layout: default
---
<article class="page-content post-detail">
  <p class="post-detail__meta">
    <a href="/{{ page.lang }}/notes/">← {{ site.data.translations[page.lang].nav.blog }}</a> · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y-%m-%d" }}</time>
  </p>
  <h1>{{ page.title }}</h1>
  <div class="post-detail__body">
    {{ content }}
  </div>
</article>
