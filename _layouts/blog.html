---
layout: default
---
<section class="wrap section">
  <h1 class="page__title">Blog</h1>
  <p class="page__lede">{{ content }}</p>
  <ul class="post-list post-list--full">
    {% for post in site.posts %}
    <li class="post-list__item">
      <a class="post-list__title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <p class="post-list__excerpt">{{ post.excerpt | strip_html | truncate: 180 }}</p>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
    </li>
    {% else %}
    <li class="post-list__empty">No posts yet — the first one is on its way.</li>
    {% endfor %}
  </ul>
</section>
