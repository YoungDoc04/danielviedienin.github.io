# ------------------------------------------------------------
# danielviedienin.com — Jekyll configuration
# ------------------------------------------------------------

title: "Daniel Viedienin"
email: youngdoc@ukr.net
description: >-
  Paramedic and medical student moving into HealthTech — emergency medicine,
  AI-assisted practice, and B2B sales experience.
url: "https://danielviedienin.com"
baseurl: ""

# ---- Multilingual settings -----------------------------------
# Manual i18n: page.lang + _data/translations.yml + one folder per
# language (/en/, /ua/, /ru/). No third-party i18n gem is used —
# it isn't needed for this setup and was dropped after an earlier
# build failure.
languages: ["en", "ua", "ru"]
default_lang: "en"

author:
  name: "Daniel Viedienin"
  email: youngdoc@ukr.net

social:
  linkedin: "https://www.linkedin.com/in/daniel-viedienin"
  telegram: "https://t.me/spittinfax"
  telegram_handle: "t.me/spittinfax"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

# ---- Permalinks -------------------------------------------------
# Applies to the built-in `posts` collection (long-form Articles).
permalink: /blog/:year/:month/:day/:title/

collections:
  notes:
    output: true
    permalink: /notes/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"

# ---- Plugins ------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ---- Build ----------------------------------------------------
# Force-include files that Jekyll would otherwise skip (dotfiles /
# files with no front matter) so Netlify gets them in `_site`.
include:
  - CNAME
  - _redirects
  - robots.txt

exclude:
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - README.md
  - "*.gemspec"
  - "*.gemfile"

sass:
  style: compressed
